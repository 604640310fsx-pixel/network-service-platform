# Render outside the repository, then validate only with an isolated nginx -t.
# Public reload and route cutover are explicitly outside this staging task.
server {
    listen @@PUBLIC_NGINX_LISTEN@@;
    server_name @@PUBLIC_NGINX_SERVER_NAME@@;

    ssl_certificate @@PUBLIC_EDGE_TLS_CERT_FILE@@;
    ssl_certificate_key @@PUBLIC_EDGE_TLS_KEY_FILE@@;

    access_log off;
    error_log stderr crit;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not_found"}';
    }

    location = /readyz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not_found"}';
    }

    set $monitor_gateway_tls_name @@PUBLIC_GATEWAY_TLS_NAME@@;

    location / {
        limit_req zone=monitor_gateway_public burst=10 nodelay;
        limit_req_status 429;

        proxy_pass @@PUBLIC_GATEWAY_ORIGIN@@;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $monitor_gateway_tls_name;
        proxy_ssl_trusted_certificate @@PUBLIC_GATEWAY_CA_FILE@@;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;

        proxy_set_header Host $monitor_gateway_tls_name;
        proxy_set_header X-Monitor-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 50s;
        proxy_send_timeout 50s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @monitor_gateway_unavailable;

        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location @monitor_gateway_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"monitor_unavailable"}';
    }
}
