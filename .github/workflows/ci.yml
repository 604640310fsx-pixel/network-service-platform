name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/consolidate-project

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Check website
        working-directory: website
        run: npm run check

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Verify website lockfile is unchanged
        run: git diff --exit-code -- website/package-lock.json

  auth-service:
    name: Auth service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Install auth service dependencies
        working-directory: auth-service
        run: npm ci

      - name: Build auth service
        working-directory: auth-service
        run: npm run build

      - name: Run full auth service test suite
        working-directory: auth-service
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(
            dist/test/*.test.js
            dist/test/auth/*.test.js
            dist/test/payment/*.test.js
          )
          if (( ${#test_files[@]} == 0 )); then
            echo "No compiled auth service tests found" >&2
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            node --test --test-isolation=none "$test_file"
          done

      - name: Verify auth service lockfile is unchanged
        run: git diff --exit-code -- auth-service/package-lock.json
