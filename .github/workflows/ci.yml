name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/consolidate-project

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor-gateway:
    name: Monitor gateway test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"

      - name: Report gateway CI runtimes
        run: |
          python3 --version
          node --version

      - name: Run gateway Python tests
        run: python3 -m unittest discover -s monitoring/gateway/tests -v

      - name: Compile gateway Python modules
        run: python3 -m py_compile monitoring/gateway/*.py

      - name: Run gateway static tests
        run: node --test monitoring/gateway/tests/static-app.test.cjs

      - name: Check gateway JavaScript syntax
        run: node --check monitoring/gateway/static/app.js

  website:
    name: Website check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Check website
        working-directory: website
        run: npm run check

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Verify website lockfile is unchanged
        run: git diff --exit-code -- website/package-lock.json

  auth-service:
    name: Auth service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Report auth CI runtime
        run: |
          node --version
          npm --version
          uname -a
          ldd --version

      - name: Install auth service dependencies
        working-directory: auth-service
        run: npm ci

      - name: Build auth service
        working-directory: auth-service
        run: npm run build

      - name: Run SQLite smoke test
        working-directory: auth-service
        run: node dist/test/db.test.js

      - name: Run full auth service test suite
        working-directory: auth-service
        run: npm test

      - name: Verify auth service lockfile is unchanged
        run: git diff --exit-code -- auth-service/package-lock.json
