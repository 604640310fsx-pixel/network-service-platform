name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/consolidate-project
      - codex/service-change-release-prepare-20261103
      - codex/residential-options-local-20261105

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Test website
        working-directory: website
        run: npm test

      - name: Check website
        working-directory: website
        run: npm run check

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Verify website lockfile is unchanged
        run: git diff --exit-code -- website/package-lock.json

  auth-service:
    name: Auth service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Report auth CI runtime
        run: |
          node --version
          npm --version
          uname -a
          ldd --version

      - name: Install auth service dependencies
        working-directory: auth-service
        run: npm ci

      - name: Build auth service
        working-directory: auth-service
        run: npm run build

      - name: Run SQLite smoke test
        working-directory: auth-service
        run: node dist/test/db.test.js

      - name: Run full auth service test suite
        working-directory: auth-service
        run: npm test

      - name: Verify auth service lockfile is unchanged
        run: git diff --exit-code -- auth-service/package-lock.json

  consolidated-release-packet:
    name: Consolidated release packet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only this same-repository review PR opts into the independent 026->030 route.
      # A fork with the same branch name and every other PR keep the frozen 026 gate.
      STANDARD26_TASK_CONTEXT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/service-change-release-prepare-20261103' && github.event.pull_request.base.ref == 'integration/consolidate-project' }}
      STANDARD26_FORMAL_CONTEXT: ${{ github.repository == '604640310fsx-pixel/network-service-platform' && github.event_name == 'push' && github.ref == 'refs/heads/codex/service-change-release-prepare-20261103' }}
      RESIDENTIAL31_TASK_CONTEXT: ${{ github.repository == '604640310fsx-pixel/network-service-platform' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.head.ref == 'codex/residential-options-local-20261105' && github.event.pull_request.base.ref == 'integration/consolidate-project') || (github.event.pull_request.head.ref == 'codex/nsp-subscribe-select-ui-20261105-01' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105') || (github.event.pull_request.head.ref == 'codex/nsp-subscribe-mobile-focus-footer-20261108-01' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105') || (github.event.pull_request.head.ref == 'codex/nsp-subscribe-line-price-20261108-01' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105') || (github.event.pull_request.head.ref == 'codex/nsp-subscribe-line-price-release-control-20261108-01' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105') || (github.event.pull_request.head.ref == 'codex/subscribe-design-tags-v13-r42-20261109' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105') || (github.event.pull_request.head.ref == 'codex/subscribe-us-dual-isp-charter-remove-20261109' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105')) }}
      RESIDENTIAL31_FORMAL_CONTEXT: ${{ github.repository == '604640310fsx-pixel/network-service-platform' && github.event_name == 'push' && github.ref == 'refs/heads/codex/residential-options-local-20261105' }}
      # This exact same-repo Draft PR gets review-only 032 provenance; formal 032 is a separate exact push gate.
      ADMIN32_TASK_CONTEXT: ${{ github.repository == '604640310fsx-pixel/network-service-platform' && github.event_name == 'pull_request' && github.event.pull_request.number == 165 && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/nsp-admin-manage-20261110-01' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105' }}
      ADMIN32_UPLOAD_FIX_TASK_CONTEXT: ${{ github.repository == '604640310fsx-pixel/network-service-platform' && github.event_name == 'pull_request' && github.event.pull_request.number == 166 && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/nsp-admin32-upload-guard-fix-20261110-01' && github.event.pull_request.base.ref == 'codex/residential-options-local-20261105' && github.event.pull_request.base.sha == '4857c9c62294a2dfdcca2187e17983720e991a2f' }}
      ADMIN32_FORMAL_CONTEXT: false
      PROVENANCE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/consolidate-project' && 'github-actions' || 'github-actions-test' }}
      VALIDATION_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/consolidate-project' && 'ci-build' || 'ci-test' }}
      MONITOR_ORIGIN_POLICY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/consolidate-project' && 'required' || 'optional' }}
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select independent standard26 formal build modes
        if: env.STANDARD26_FORMAL_CONTEXT == 'true'
        run: |
          printf '%s\n' 'PROVENANCE_MODE=github-actions' 'VALIDATION_MODE=ci-build' 'MONITOR_ORIGIN_POLICY=required' >> "$GITHUB_ENV"

      - name: Select exact residential31 push formal build modes
        if: env.RESIDENTIAL31_FORMAL_CONTEXT == 'true'
        run: |
          printf '%s\n' 'PROVENANCE_MODE=github-actions' 'VALIDATION_MODE=ci-build' 'MONITOR_ORIGIN_POLICY=required' >> "$GITHUB_ENV"

      - name: Select exact admin32 push formal build modes
        if: env.RESIDENTIAL31_FORMAL_CONTEXT == 'true'
        run: |
          if test -f auth-service/src/migrations/032_catalog_directory_and_last_login.sql; then
            printf '%s\n' 'ADMIN32_FORMAL_CONTEXT=true' 'PROVENANCE_MODE=github-actions' 'VALIDATION_MODE=ci-build' 'MONITOR_ORIGIN_POLICY=required' >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            auth-service/package-lock.json
            website/package-lock.json

      - name: Validate release packet source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/ops/validate-release-open-http-contract.mjs \
            --source "$GITHUB_WORKSPACE"
          if [ "$ADMIN32_FORMAL_CONTEXT" = "true" ]; then
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
              --schema-route standard31-32 --validation-mode ci-build
          elif [ "$ADMIN32_TASK_CONTEXT" = "true" ] || [ "$ADMIN32_UPLOAD_FIX_TASK_CONTEXT" = "true" ]; then
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
              --schema-route standard31-32
          elif [ "$RESIDENTIAL31_FORMAL_CONTEXT" = "true" ]; then
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
              --schema-route standard26-31 --validation-mode ci-build
          elif [ "$RESIDENTIAL31_TASK_CONTEXT" = "true" ]; then
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
              --schema-route standard26-31
          elif [ "$STANDARD26_FORMAL_CONTEXT" = "true" ]; then
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --schema-route standard26-30 --validation-mode ci-build
          elif [ "$STANDARD26_TASK_CONTEXT" = "true" ]; then
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --schema-route standard26-30
          else
            node scripts/ops/validate-consolidated-release-packet.mjs \
              --source "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA"
          fi

      - name: Run monitor gateway offline tests
        run: |
          python3 -m unittest discover -s monitoring/gateway/tests -v
          python3 -m unittest discover -s monitoring/dashboard-next/tests -v
          python3 -m py_compile monitoring/gateway/*.py
          python3 -m py_compile monitoring/dashboard-next/server.py
          node --test monitoring/gateway/tests/static-app.test.cjs
          node --check monitoring/gateway/static/app.js

      - name: Install build dependencies
        run: |
          npm --prefix auth-service ci
          npm --prefix website ci

      - name: Validate and build candidate artifacts
        env:
          # Approved public monitor origin; a secret so the value is masked in logs.
          VITE_MONITOR_URL: ${{ secrets.NSP_PUBLIC_MONITOR_ORIGIN }}
        run: |
          node scripts/ops/verify-website-monitor-origin.mjs \
            --phase configured --policy "$MONITOR_ORIGIN_POLICY"
          npm --prefix auth-service test
          if [ "$ADMIN32_TASK_CONTEXT" = "true" ] || [ "$ADMIN32_UPLOAD_FIX_TASK_CONTEXT" = "true" ] || [ "$ADMIN32_FORMAL_CONTEXT" = "true" ]; then
            test "$(sha256sum auth-service/dist/src/payment/pricing.js | awk '{print $1}')" = \
              "6aff457355395f275ed88eca51510741fb1fe226170b8ab5fdf3453f8a57cb36"
          fi
          node auth-service/dist/test/db.test.js
          node auth-service/dist/test/diagnosis/migration.test.js
          npm --prefix website test
          npm --prefix website run check
          npm --prefix website run build
          node scripts/ops/verify-website-monitor-origin.mjs \
            --phase embedded --policy "$MONITOR_ORIGIN_POLICY" --dist website/dist

      - name: Build and exercise independent admin32 rollback Auth
        if: env.ADMIN32_TASK_CONTEXT == 'true' || env.ADMIN32_UPLOAD_FIX_TASK_CONTEXT == 'true' || env.ADMIN32_FORMAL_CONTEXT == 'true'
        env:
          ADMIN32_ROLLBACK_ROOT: ${{ runner.temp }}/admin32-rollback-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test ! -e "$ADMIN32_ROLLBACK_ROOT"
          mkdir -p "$ADMIN32_ROLLBACK_ROOT"
          git archive 381aa5d0a7ad4bfadf68db67227b0321cc3d24f3 auth-service | tar -x -C "$ADMIN32_ROLLBACK_ROOT"
          (cd "$ADMIN32_ROLLBACK_ROOT" && git apply --check "$GITHUB_WORKSPACE/scripts/ops/patches/admin32-rollback-from-381.patch")
          (cd "$ADMIN32_ROLLBACK_ROOT" && git apply "$GITHUB_WORKSPACE/scripts/ops/patches/admin32-rollback-from-381.patch")
          ln -s "$GITHUB_WORKSPACE/auth-service/node_modules" "$ADMIN32_ROLLBACK_ROOT/auth-service/node_modules"
          node "$GITHUB_WORKSPACE/auth-service/node_modules/typescript/bin/tsc" -p "$ADMIN32_ROLLBACK_ROOT/auth-service/tsconfig.json"
          test "$(sha256sum "$ADMIN32_ROLLBACK_ROOT/auth-service/dist/src/payment/pricing.js" | awk '{print $1}')" = \
            "6aff457355395f275ed88eca51510741fb1fe226170b8ab5fdf3453f8a57cb36"
          node auth-service/test/admin32-independent-rollback.mjs "$ADMIN32_ROLLBACK_ROOT/auth-service"

      - name: Test release tooling
        run: node --test scripts/ops/consolidated-release-packet.test.mjs scripts/ops/release-safety-guards.test.mjs

      - name: Assemble twice and validate inventories
        env:
          BUNDLE_PARENT: ${{ runner.temp }}/consolidated-release-${{ github.run_id }}-${{ github.run_attempt }}
          ADMIN32_ROLLBACK_ROOT: ${{ runner.temp }}/admin32-rollback-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test ! -e "$BUNDLE_PARENT"
          mkdir -p "$BUNDLE_PARENT"
          if [ "$ADMIN32_TASK_CONTEXT" = "true" ] || [ "$ADMIN32_UPLOAD_FIX_TASK_CONTEXT" = "true" ] || [ "$ADMIN32_FORMAL_CONTEXT" = "true" ]; then
            for ordinal in first second; do
              node scripts/ops/assemble-consolidated-release.mjs \
                --source "$GITHUB_WORKSPACE" --destination "$BUNDLE_PARENT/admin32-$ordinal" \
                --expected-sha "$EXPECTED_SHA" --provenance-mode "$PROVENANCE_MODE" \
                --schema-route standard31-32 --admin32-rollback-source "$ADMIN32_ROLLBACK_ROOT"
              node scripts/ops/validate-release-open-http-contract.mjs \
                --source "$BUNDLE_PARENT/admin32-$ordinal"
              node scripts/ops/validate-consolidated-release-packet.mjs \
                --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
                --bundle "$BUNDLE_PARENT/admin32-$ordinal" \
                --validation-mode "$VALIDATION_MODE" --schema-route standard31-32
              if [ "$ordinal" = first ]; then
                ln -s "$GITHUB_WORKSPACE/auth-service/node_modules" "$BUNDLE_PARENT/admin32-first/auth-service/node_modules"
                node auth-service/test/admin32-independent-rollback.mjs \
                  "$BUNDLE_PARENT/admin32-first/auth-service/rollback32"
                unlink "$BUNDLE_PARENT/admin32-first/auth-service/node_modules"
                node scripts/ops/validate-consolidated-release-packet.mjs \
                  --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
                  --bundle "$BUNDLE_PARENT/admin32-first" \
                  --validation-mode "$VALIDATION_MODE" --schema-route standard31-32
              fi
              if find "$BUNDLE_PARENT/admin32-$ordinal" \
                \( -type l -o -name node_modules -o -name '.env*' \
                   -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
                   -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
                echo "forbidden admin32 review bundle entry detected" >&2
                exit 1
              fi
            done
            cmp "$BUNDLE_PARENT/admin32-first/release-manifest.json" "$BUNDLE_PARENT/admin32-second/release-manifest.json"
          elif [ "$RESIDENTIAL31_TASK_CONTEXT" = "true" ] || [ "$RESIDENTIAL31_FORMAL_CONTEXT" = "true" ]; then
            for ordinal in first second; do
              node scripts/ops/assemble-consolidated-release.mjs \
                --source "$GITHUB_WORKSPACE" --destination "$BUNDLE_PARENT/residential31-$ordinal" \
                --expected-sha "$EXPECTED_SHA" --provenance-mode "$PROVENANCE_MODE" \
                --schema-route standard26-31
              node scripts/ops/validate-release-open-http-contract.mjs \
                --source "$BUNDLE_PARENT/residential31-$ordinal"
              node scripts/ops/validate-consolidated-release-packet.mjs \
                --source "$GITHUB_WORKSPACE" --expected-sha "$EXPECTED_SHA" \
                --bundle "$BUNDLE_PARENT/residential31-$ordinal" \
                --validation-mode "$VALIDATION_MODE" --schema-route standard26-31
              if find "$BUNDLE_PARENT/residential31-$ordinal" \
                \( -type l -o -name node_modules -o -name '.env*' \
                   -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
                   -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
                echo "forbidden residential31 bundle entry detected" >&2
                exit 1
              fi
            done
            cmp "$BUNDLE_PARENT/residential31-first/release-manifest.json" "$BUNDLE_PARENT/residential31-second/release-manifest.json"
          else
          if [ "$STANDARD26_TASK_CONTEXT" = "true" ] || [ "$STANDARD26_FORMAL_CONTEXT" = "true" ]; then
            for ordinal in first second; do
              node scripts/ops/assemble-consolidated-release.mjs \
                --source "$GITHUB_WORKSPACE" \
                --destination "$BUNDLE_PARENT/standard26-$ordinal" \
                --expected-sha "$EXPECTED_SHA" \
                --provenance-mode "$PROVENANCE_MODE" \
                --schema-route standard26-30
              node scripts/ops/validate-release-open-http-contract.mjs \
                --source "$BUNDLE_PARENT/standard26-$ordinal"
              node scripts/ops/validate-consolidated-release-packet.mjs \
                --source "$GITHUB_WORKSPACE" \
                --expected-sha "$EXPECTED_SHA" \
                --bundle "$BUNDLE_PARENT/standard26-$ordinal" \
                --validation-mode "$VALIDATION_MODE" \
                --schema-route standard26-30
              if find "$BUNDLE_PARENT/standard26-$ordinal" \
                \( -type l -o -name node_modules -o -name '.env*' \
                   -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
                   -o -name '*.pem' -o -name '*.key' \) \
                -print -quit | grep -q .; then
                echo "forbidden standard26 review bundle entry detected" >&2
                exit 1
              fi
            done
            cmp "$BUNDLE_PARENT/standard26-first/release-manifest.json" \
              "$BUNDLE_PARENT/standard26-second/release-manifest.json"
          else
          node scripts/ops/assemble-consolidated-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --destination "$BUNDLE_PARENT/first" \
            --expected-sha "$EXPECTED_SHA" \
            --provenance-mode "$PROVENANCE_MODE" \
            --schema-route standard16-26
          node scripts/ops/assemble-consolidated-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --destination "$BUNDLE_PARENT/second" \
            --expected-sha "$EXPECTED_SHA" \
            --provenance-mode "$PROVENANCE_MODE" \
            --schema-route standard16-26
          cmp "$BUNDLE_PARENT/first/release-manifest.json" \
            "$BUNDLE_PARENT/second/release-manifest.json"
          node scripts/ops/validate-release-open-http-contract.mjs \
            --source "$BUNDLE_PARENT/first"
          node scripts/ops/validate-release-open-http-contract.mjs \
            --source "$BUNDLE_PARENT/second"
          node scripts/ops/validate-consolidated-release-packet.mjs \
            --source "$GITHUB_WORKSPACE" \
            --expected-sha "$EXPECTED_SHA" \
            --bundle "$BUNDLE_PARENT/first" \
            --validation-mode "$VALIDATION_MODE" \
            --schema-route standard16-26
          node scripts/ops/validate-consolidated-release-packet.mjs \
            --source "$GITHUB_WORKSPACE" \
            --expected-sha "$EXPECTED_SHA" \
            --bundle "$BUNDLE_PARENT/second" \
            --validation-mode "$VALIDATION_MODE" \
            --schema-route standard16-26
          node scripts/ops/assemble-consolidated-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --destination "$BUNDLE_PARENT/direct14-first" \
            --expected-sha "$EXPECTED_SHA" \
            --provenance-mode "$PROVENANCE_MODE" \
            --schema-route direct14-26
          node scripts/ops/assemble-consolidated-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --destination "$BUNDLE_PARENT/direct14-second" \
            --expected-sha "$EXPECTED_SHA" \
            --provenance-mode "$PROVENANCE_MODE" \
            --schema-route direct14-26
          cmp "$BUNDLE_PARENT/direct14-first/release-manifest.json" \
            "$BUNDLE_PARENT/direct14-second/release-manifest.json"
          node scripts/ops/validate-release-open-http-contract.mjs \
            --source "$BUNDLE_PARENT/direct14-first"
          node scripts/ops/validate-consolidated-release-packet.mjs \
            --source "$GITHUB_WORKSPACE" \
            --expected-sha "$EXPECTED_SHA" \
            --bundle "$BUNDLE_PARENT/direct14-first" \
            --validation-mode "$VALIDATION_MODE" \
            --schema-route direct14-26
          node scripts/ops/validate-consolidated-release-packet.mjs \
            --source "$GITHUB_WORKSPACE" \
            --expected-sha "$EXPECTED_SHA" \
            --bundle "$BUNDLE_PARENT/direct14-second" \
            --validation-mode "$VALIDATION_MODE" \
            --schema-route direct14-26
          if find "$BUNDLE_PARENT/first" \
            \( -type l -o -name node_modules -o -name '.env*' \
               -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
               -o -name '*.pem' -o -name '*.key' \) \
            -print -quit | grep -q .; then
            echo "forbidden release bundle entry detected" >&2
            exit 1
          fi
          if find "$BUNDLE_PARENT/direct14-first" \
            \( -type l -o -name node_modules -o -name '.env*' \
               -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
               -o -name '*.pem' -o -name '*.key' \) \
            -print -quit | grep -q .; then
            echo "forbidden direct14 release bundle entry detected" >&2
            exit 1
          fi
          node scripts/ops/assemble-consolidated-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --destination "$BUNDLE_PARENT/standard19-first" \
            --expected-sha "$EXPECTED_SHA" \
            --provenance-mode "$PROVENANCE_MODE" \
            --schema-route standard19-26
          node scripts/ops/assemble-consolidated-release.mjs \
            --source "$GITHUB_WORKSPACE" \
            --destination "$BUNDLE_PARENT/standard19-second" \
            --expected-sha "$EXPECTED_SHA" \
            --provenance-mode "$PROVENANCE_MODE" \
            --schema-route standard19-26
          cmp "$BUNDLE_PARENT/standard19-first/release-manifest.json" \
            "$BUNDLE_PARENT/standard19-second/release-manifest.json"
          node scripts/ops/validate-release-open-http-contract.mjs \
            --source "$BUNDLE_PARENT/standard19-first"
          node scripts/ops/validate-consolidated-release-packet.mjs \
            --source "$GITHUB_WORKSPACE" \
            --expected-sha "$EXPECTED_SHA" \
            --bundle "$BUNDLE_PARENT/standard19-first" \
            --validation-mode "$VALIDATION_MODE" \
            --schema-route standard19-26
          node scripts/ops/validate-consolidated-release-packet.mjs \
            --source "$GITHUB_WORKSPACE" \
            --expected-sha "$EXPECTED_SHA" \
            --bundle "$BUNDLE_PARENT/standard19-second" \
            --validation-mode "$VALIDATION_MODE" \
            --schema-route standard19-26
          if find "$BUNDLE_PARENT/standard19-first" \
            \( -type l -o -name node_modules -o -name '.env*' \
               -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
               -o -name '*.pem' -o -name '*.key' \) \
            -print -quit | grep -q .; then
            echo "forbidden standard19 release bundle entry detected" >&2
            exit 1
          fi
          fi

          fi

      - name: Retain admin32 PR review bundle (never production)
        if: env.ADMIN32_TASK_CONTEXT == 'true' || env.ADMIN32_UPLOAD_FIX_TASK_CONTEXT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-admin32-review-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/consolidated-release-${{ github.run_id }}-${{ github.run_attempt }}/admin32-first/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Retain exact admin32 push formal candidate
        if: env.ADMIN32_FORMAL_CONTEXT == 'true' && github.sha == env.EXPECTED_SHA
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-admin32-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/consolidated-release-${{ github.run_id }}-${{ github.run_attempt }}/admin32-first/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Retain residential31 PR review bundle (never production)
        if: env.RESIDENTIAL31_TASK_CONTEXT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-residential31-review-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/consolidated-release-${{ github.run_id }}-${{ github.run_attempt }}/residential31-first/
