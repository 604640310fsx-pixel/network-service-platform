          include-hidden-files: false

      - name: Verify lockfiles are unchanged
        run: |
          git diff --exit-code -- auth-service/package-lock.json
          git diff --exit-code -- website/package-lock.json

      - name: Retain exact residential31 push formal candidate
        id: upload-residential31-formal
        if: env.RESIDENTIAL31_FORMAL_CONTEXT == 'true' && env.ADMIN32_FORMAL_CONTEXT != 'true' && github.sha == env.EXPECTED_SHA
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-residential31-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/consolidated-release-${{ github.run_id }}-${{ github.run_attempt }}/residential31-first/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Record residential31 artifact proof
        if: env.RESIDENTIAL31_FORMAL_CONTEXT == 'true' && env.ADMIN32_FORMAL_CONTEXT != 'true' && github.sha == env.EXPECTED_SHA
        env:
          ARTIFACT_ID: ${{ steps.upload-residential31-formal.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-residential31-formal.outputs.artifact-digest }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -n "$ARTIFACT_ID"
          printf '%s\n' "$ARTIFACT_DIGEST" | grep -Eq '^[a-f0-9]{64}$'
          printf 'Residential31 candidate: `%s`, artifact `%s`, digest `sha256:%s`\n' "$EXPECTED_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact independent standard26 formal candidate
        id: upload-standard26-formal
        if: env.STANDARD26_FORMAL_CONTEXT == 'true' && github.sha == env.EXPECTED_SHA
        uses: actions/upload-artifact@v4
        with:
