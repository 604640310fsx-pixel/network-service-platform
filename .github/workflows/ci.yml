        env:
          ARTIFACT_ID: ${{ steps.upload-standard26-formal.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-standard26-formal.outputs.artifact-digest }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -n "$ARTIFACT_ID"
          printf '%s\n' "$ARTIFACT_DIGEST" | grep -Eq '^[a-f0-9]{64}$'
          printf 'Independent standard26 candidate: `%s`, artifact `%s`, digest `sha256:%s`\n' "$EXPECTED_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact integration release candidate
        id: upload-release-candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/consolidate-project' && github.sha == env.EXPECTED_SHA
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/consolidated-release-${{ github.run_id }}-${{ github.run_attempt }}/first/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Record candidate artifact proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/consolidate-project' && github.sha == env.EXPECTED_SHA
        env:
          ARTIFACT_ID: ${{ steps.upload-release-candidate.outputs.artifact-id }}
