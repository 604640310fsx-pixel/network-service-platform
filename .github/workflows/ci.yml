          include-hidden-files: false

      - name: Retain exact standard26 PR review bundle (not a production release)
        if: env.STANDARD26_TASK_CONTEXT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-release-standard26-review-${{ env.EXPECTED_SHA }}
